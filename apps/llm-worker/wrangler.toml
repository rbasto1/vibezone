name = "llm-worker"
main = "src/worker.ts"
compatibility_date = "2025-08-29"
# compatibility_flags = ["nodejs_compat"]

# Custom domain configuration
[[routes]]
pattern = "gen.vibezone.ai"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
WORKER_ALLOWED_ORIGIN = "https://www.vibezone.ai"

# Durable Objects
[[durable_objects.bindings]]
name = "USAGE"
class_name = "Usage"

[[migrations]]
tag = "usage-v1"
new_classes = ["Usage"]
